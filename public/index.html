<!DOCTYPE html>
<html lang="hu">
  <head>
    <!-- Az index.html sose cache-elődjön a böngészőben/proxy-ban — enélkül
         egy új deploy után az emberek a régi, elavult verziót láthatják
         (ez a .htaccess-ben lévő Cache-Control fejléc kliensoldali,
         meta-tages tartaléka, arra az esetre, ha a szerver fejléc valamiért
         nem érvényesül). `no-store` szándékosan NINCS itt: az letiltaná a
         böngésző back/forward-cache-ét (lassabb "vissza" navigáció),
         miközben a `no-cache, must-revalidate` önmagában is minden
         betöltéskor friss verziót kényszerít ki. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="/manifest.json" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index,follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- A teljesítmény-audit szerint a header logó (`/logo2.svg`) a mért LCP
         elem minden oldalon, és a mérés 80%+-a nem a kép letöltésén (a TTFB
         kiváló), hanem a React-hidratáció/render-idején múlik — ezt a
         preload/fetchpriority pár önmagában nem oldja meg, de biztonságos,
         additív lépés: garantálja, hogy a kép letöltése a lehető
         leghamarabb, a legmagasabb prioritással induljon, ha mégis lenne
         verseny más erőforrásokkal. -->
    <link rel="preload" as="image" href="/logo2.svg" fetchpriority="high" />
    <!-- `display=optional` (nem `swap`): a böngésző csak akkor vált a
         betöltött Overpass fontra, ha az ~100ms-en belül elkészül,
         különben megtartja a rendszer-betűtípust az egész oldalbetöltés
         alatt — ez szünteti meg azt a látható "ugrást", amit a késleltetett
         font-csere okozott (a bejelentkező kártya és a szöveg újratördelése
         a fallback és az Overpass eltérő betűméretei miatt). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&family=Overpass+Mono:wght@400;500;600;700&display=optional"
      rel="stylesheet"
    />
